site_name: KARML Documentation
site_description: Molecular Mechanics and Machine-Learned Force-Field Toolkit
site_url: https://karml.readthedocs.io/
repo_url: https://github.com/EricBoittier/karml
repo_name: EricBoittier/karml

# Keep manuscript LaTeX sources in-tree but out of the HTML docs build.
exclude_docs: |
  manuscripts/**/latex/**

# Pages that are built and linkable but intentionally omitted from the sidebar
# (image-gallery READMEs, auto-generated coverage tables).
not_in_nav: |
  /images/dense-dt-campaign/**
  /images/des-so3lr-dimers/lj_types.md
  /images/des-so3lr-dimers/resi_coverage.md
  /images/npt_argon_water/**

theme:
  name: material
  logo: images/logo-mark.svg
  favicon: images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            show_submodules: false
            members_order: source

